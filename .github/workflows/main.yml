# Workflow GitHub Actions pour le pipeline CI/CD
name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install KVM/QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virt-manager libvirt-dev
          sudo systemctl enable --now libvirtd

      - name: Set up sudo without password for libvirt
        run: |
          echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner

      - name: Add user to libvirt group
        run: |
          sudo usermod -aG libvirt runner
          sudo systemctl restart libvirtd

      - name: Fix Libvirt socket permissions
        run: |
          sudo chown runner:libvirt /var/run/libvirt/libvirt-sock
          sudo chmod 660 /var/run/libvirt/libvirt-sock

      - name: Install Vagrant
        run: |
          sudo apt-get install -y curl
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run Linting
        run: ./scripts/lint.sh

      - name: Install Vagrant Libvirt Plugin
        run: vagrant plugin install vagrant-libvirt

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Provision VMs
        run: vagrant up

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run Functionality Tests
        run: ./scripts/test_functionality.sh

      - name: Run Security Tests
        run: ./scripts/test_security.sh

      - name: Run Fluteng log_manager
        run: 

      - name: Run Syslog log_manager
        run:  

      - name: Run ELK log_manager
        run:

      - name: Make scripts executable
        run: chmod +x ci-cd/notifications/*.sh
      
      - name: Send Notification
        run: ./ci-cd/notifications/gmail_notification.sh
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}